name: Backend CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint:
    name: Lint Go Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24' # Assurez-vous que cela correspond à votre go.mod

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Run golangci-lint
        run: golangci-lint run ./... --timeout=5m # Exécute le linter sur tout le projet

  build:
    name: Build Go Application
    runs-on: ubuntu-latest
    needs: lint # S'exécute après le job de lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build
        run: go build -v -o spm-server ./cmd/server/main.go # Compile le point d'entrée principal

      # Optionnel: Upload l'artefact de build (si vous voulez le conserver)
      # - name: Upload build artifact
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: spm-server-binary
      #     path: spm-server