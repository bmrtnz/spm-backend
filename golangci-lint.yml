run:
  timeout: 5m
  skip-dirs:
    - vendor/
  # go: '1.24' # Spécifiez la version de Go si nécessaire

linters-settings:
  govet:
    check-shadowing: true
  golint:
    min-confidence: 0.8
  gocyclo:
    min-complexity: 15
  maligned:
    suggest-new: true
  dupl:
    threshold: 100
  goconst:
    min-len: 2
    min-occurrences: 2

linters:
  disable-all: true
  enable:
    - bodyclose
    - deadcode
    - errcheck
    - goconst
    - gocyclo
    - gofmt
    - goimports
    - golint
    # - gomnd # Peut être bruyant
    - goprintffuncname
    - gosec
    - gosimple
    - govet
    - ineffassign
    # - interfacer # Déprécié
    # - maligned # Déprécié
    - misspell
    - nakedret
    - rowserrcheck
    - staticcheck
    - structcheck
    - stylecheck
    # - testpackage # Peut nécessiter une configuration spécifique
    - typecheck
    - unconvert
    - unparam
    - unused
    - varcheck
    - whitespace

issues:
  exclude-use-default: false
  max-per-linter: 0
  max-same-issues: 0